<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Page</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }

      th, td {
        padding: 10px 20px;
        text-align: left;
        border: 1px solid #ccc;
      }

      th {
        background-color: #f2f2f2;
        font-weight: bold;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <h1>Add Games</h1>
    <form method="POST">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Save</button>
    </form>
    <h1>Games List</h1>
    <table>
      <tr>
        <th>Game #</th>
        <th>Player 1</th>
        <th>Player 1 Score</th>
        <th>Player 2</th>
        <th>Player 2 Score</th>
        <th>Action</th>
      </tr>
      {% for game in games %}
      <tr>
        <td>{{ game.id }}</td>
        <td>{{ game.player1_name }}</td>
        <td>{{ game.player1_score }}</td>
        <td>{{ game.player2_name }}</td>
        <td>{{ game.player2_score }}</td>
        <td>
          <a href="{% url 'edit_game' game.id %}">Edit</a>
          <a href="{% url 'delete_game' game.id %}">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </table>
    <a href="/" style="text-decoration:none; display:inline-block;">Play New Game</a>
  </body>
</html>
